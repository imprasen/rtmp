server {
    listen 80;
    server_name localhost;

    # Docker internal DNS resolver (resolves at request-time, not startup)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 1. Serve static React frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API calls to the Node.js backend
    location /api/ {
        set $backend "http://server:5011";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Proxy WebRTC WHEP signaling to MediaMTX
    location /whep/ {
        set $whep "http://mediamtx:8889";
        rewrite ^/whep/(.*)$ /$1 break;
        proxy_pass $whep;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    # 4. Proxy HLS video segments to MediaMTX
    location /hls/ {
        set $hls "http://mediamtx:8888";
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass $hls;
        proxy_redirect / /hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Direct live stream segments from MediaMTX redirects
    location /live/ {
        set $hls "http://mediamtx:8888";
        proxy_pass $hls$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
