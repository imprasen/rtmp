<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Slate Rounded Background -->
  <rect width="64" height="64" rx="16" fill="#0b0f19" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" />
  <!-- Drone Arms -->
  <line x1="16" y1="16" x2="32" y2="32" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
  <line x1="48" y1="16" x2="32" y2="32" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
  <line x1="16" y1="48" x2="32" y2="32" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
  <line x1="48" y1="48" x2="32" y2="32" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
  <!-- Drone Rotors -->
  <circle cx="16" cy="16" r="8" stroke="#10b981" stroke-width="2.5" fill="#064e3b" fill-opacity="0.5" />
  <line x1="12" y1="16" x2="20" y2="16" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <circle cx="48" cy="16" r="8" stroke="#10b981" stroke-width="2.5" fill="#064e3b" fill-opacity="0.5" />
  <line x1="44" y1="16" x2="52" y2="16" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <circle cx="16" cy="48" r="8" stroke="#10b981" stroke-width="2.5" fill="#064e3b" fill-opacity="0.5" />
  <line x1="12" y1="48" x2="20" y2="48" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <circle cx="48" cy="48" r="8" stroke="#10b981" stroke-width="2.5" fill="#064e3b" fill-opacity="0.5" />
  <line x1="44" y1="48" x2="52" y2="48" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <!-- Central Body / Optical Sensor -->
  <circle cx="32" cy="32" r="11" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="32" cy="32" r="6" fill="#0284c7" />
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
  <!-- Red Live Beacon -->
  <circle cx="48" cy="16" r="3.5" fill="#ef4444" />
</svg>
