# MediaMTX Configuration (v1.20+)
# Optimized for Ultra-Low Latency Drone Live Streaming & Auto-Recording

###############################################
# Logging Configuration (Field Debugging)
###############################################
logLevel: debug
logDestinations: [stdout]

# RTMP Ingest (Drone / OBS push)
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# RTSP Ingest/Egress
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]

# WebRTC (WHEP / WHIP) - Sub-500ms Ultra Low Latency playback
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcAdditionalHosts: ["14.97.37.70", "rtmp.dhanushuav.in"]

# HLS - Universal Low Latency fallback playback
hls: yes
hlsAddress: :8888
hlsVariant: mpegts
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigins: ["*"]

# MediaMTX Control API
api: yes
apiAddress: :9997

###############################################
# Authentication Hook
###############################################
authMethod: http
authHTTPAddress: http://server:5011/api/hooks/auth

###############################################
# Paths Configuration
###############################################
paths:
  # ── INGEST paths: DJI drones publish here for auto-transcoding ──
  # FFmpeg auto-transcodes non-standard resolutions to clean 1280x720 and republishes to live/*
  ~^ingest/.*$:
    runOnReady: >
      sh -c 'LIVE_PATH=$(echo $MTX_PATH | sed "s/ingest/live/");
      ffmpeg -i rtsp://localhost:8554/$MTX_PATH
      -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2"
      -c:v libx264 -preset ultrafast -tune zerolatency -g 30 -keyint_min 30 -b:v 2500k -maxrate 3000k -bufsize 5000k
      -c:a aac -b:a 128k -ar 44100 -ac 2
      -f rtsp rtsp://localhost:8554/$LIVE_PATH'
    runOnReadyRestart: yes

  # ── LIVE paths: OBS/direct publishers + Transcoded drone output + Web playback + Recording ──
  ~^live/.*$:
    # Auto-record flight as ONE single continuous MP4 file (up to 6 hours)
    record: yes
    recordPath: /recordings/%path_%Y-%m-%d_%H-%M-%S
    recordFormat: fmp4
    recordSegmentDuration: 6h

  # Default fallback path
  all_others:
