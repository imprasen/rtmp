# MediaMTX Configuration (v1.20+)
# Optimized for Ultra-Low Latency Drone Live Streaming & Auto-Recording

###############################################
# Logging Configuration (Field Debugging)
###############################################
logLevel: debug
logDestinations: [stdout]

###############################################
# Protocol Listeners
###############################################

# RTMP — DISABLED: nginx-rtmp handles RTMP ingest and relays to MediaMTX via RTSP
# This fixes DJI RS 2 "received a packet for video track 0, but track is not set up"
rtmp: no
# rtmpAddress: :1935

# RTSP Ingest/Egress
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]

# WebRTC (WHEP / WHIP) - Sub-500ms Ultra Low Latency playback
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcAdditionalHosts: ["14.97.37.70", "rtmp.dhanushuav.in"]

# HLS - Universal Low Latency fallback playback
hls: yes
hlsAddress: :8888
hlsVariant: mpegts
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigins: ["*"]

# MediaMTX Control API
api: yes
apiAddress: :9997

###############################################
# Authentication — DISABLED for RTSP ingest from nginx-rtmp
# nginx-rtmp validates stream keys via on_publish callback BEFORE relaying here
###############################################
# authMethod: http
# authHTTPAddress: http://server:5011/api/hooks/auth

###############################################
# Paths Configuration
###############################################
paths:
  # ── LIVE paths: Receives RTSP relay from nginx-rtmp + Web playback + Recording ──
  ~^live/.*$:
    # Auto-record flight as ONE single continuous MP4 file (up to 6 hours)
    record: yes
    recordPath: /recordings/%path_%Y-%m-%d_%H-%M-%S
    recordFormat: fmp4
    recordSegmentDuration: 6h

  # Default fallback path
  all_others:
