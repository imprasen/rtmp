daemon off;
error_log /dev/stdout info;

events {
    worker_connections 1024;
}

# RTMP Ingest — accepts all DJI drone, OBS, and mobile RTMP publishers
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_message 10M;

        # Connection stability: tolerate momentary cellular jitter without terminating stream
        ping 10s;
        ping_timeout 5s;
        drop_idle_publisher 10s;

        # Allow anyone to publish (auth checked via on_publish webhook)
        allow publish all;

        # Allow localhost (FFmpeg relay) to play/read the stream; deny external players
        allow play 127.0.0.1;
        deny play all;

        application live {
            live on;
            record off;

            # Authentication callback — validates stream key against Node.js API
            on_publish http://server:5011/api/hooks/rtmp-auth;

            # Relay accepted stream to MediaMTX via RTSP (TCP)
            # Re-packets stream cleanly so MediaMTX receives proper SPS/PPS headers
            exec_push ffmpeg -fflags nobuffer -flags low_delay -analyzeduration 100000 -probesize 100000 -i rtmp://127.0.0.1:1935/live/$name -c copy -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/live/$name 2>>/tmp/ffmpeg-$name.log;

            # Notify server when stream ends for recording finalization
            on_publish_done http://server:5011/api/hooks/on-unpublish-nginx;
        }

        application ingest {
            live on;
            record off;

            # Authentication callback
            on_publish http://server:5011/api/hooks/rtmp-auth;

            # Transcode non-standard drone resolutions to clean 1280x720 and relay
            exec_push ffmpeg -fflags nobuffer -flags low_delay -analyzeduration 100000 -probesize 100000 -i rtmp://127.0.0.1:1935/ingest/$name -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2" -c:v libx264 -preset ultrafast -tune zerolatency -g 30 -keyint_min 30 -b:v 2500k -maxrate 3000k -bufsize 5000k -c:a aac -b:a 128k -ar 44100 -ac 2 -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/live/$name 2>>/tmp/ffmpeg-transcode-$name.log;

            on_publish_done http://server:5011/api/hooks/on-unpublish-nginx;
        }
    }
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log /dev/stdout combined;

    server {
        listen 8080;

        location /stat {
            rtmp_stat all;
        }
    }
}
