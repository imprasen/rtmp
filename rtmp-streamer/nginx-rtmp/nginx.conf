worker_processes auto;
rtmp_auto_push on;
env PATH;

events {
    worker_connections 1024;
}

# RTMP Ingest — accepts all DJI drone, OBS, and mobile RTMP publishers
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_message 10M;

        # Allow publishing from any IP (auth handled by on_publish callback)
        allow publish all;
        deny play all;

        application live {
            live on;
            record off;

            # Authentication callback — validates stream key against our Node.js API
            on_publish http://server:5011/api/hooks/rtmp-auth;

            # Relay accepted stream to MediaMTX via RTSP (TCP)
            # Re-packets stream cleanly so MediaMTX receives proper SPS/PPS headers
            exec_push /usr/bin/ffmpeg -i rtmp://localhost:1935/live/$name -analyzeduration 1000000 -probesize 1000000 -c copy -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/live/$name 2>>/tmp/ffmpeg-$name.log;

            # Notify server when stream ends for recording finalization
            on_publish_done http://server:5011/api/hooks/on-unpublish-nginx;
        }

        application ingest {
            live on;
            record off;

            # Authentication callback
            on_publish http://server:5011/api/hooks/rtmp-auth;

            # Transcode non-standard drone resolutions to clean 1280x720 and relay
            exec_push /usr/bin/ffmpeg -i rtmp://localhost:1935/ingest/$name -analyzeduration 1000000 -probesize 1000000 -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2" -c:v libx264 -preset ultrafast -tune zerolatency -g 30 -keyint_min 30 -b:v 2500k -maxrate 3000k -bufsize 5000k -c:a aac -b:a 128k -ar 44100 -ac 2 -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/live/$name 2>>/tmp/ffmpeg-transcode-$name.log;

            on_publish_done http://server:5011/api/hooks/on-unpublish-nginx;
        }
    }
}
