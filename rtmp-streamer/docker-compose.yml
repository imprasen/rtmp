# ================================================================
# Local RTMP Live-Streaming Application (Docker Compose)
# ================================================================

services:
  # 0. Nginx-RTMP: DJI-compatible RTMP ingest relay
  #    Accepts RTMP from DJI drones, OBS, etc. and relays to MediaMTX via RTSP
  #    Solves: "received a packet for video track 0, but track is not set up"
  nginx-rtmp:
    build:
      context: ./nginx-rtmp
      dockerfile: Dockerfile
    container_name: rtmp-nginx-rtmp
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest (drones / OBS push) — moved from MediaMTX
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      - mediamtx
      - server

  # 1. MediaMTX: Media server (RTSP, WebRTC, HLS) — NO longer handles RTMP ingest directly
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: rtmp-mediamtx
    restart: unless-stopped
    ports:
      # RTMP port 1935 moved to nginx-rtmp service above
      - "8554:8554"   # RTSP ingest (receives relayed streams from nginx-rtmp)
      - "8888:8888"   # HLS (LL-HLS) playback
      - "8889:8889"   # WebRTC (WHEP) signaling (TCP)
      - "8889:8889/udp" # WebRTC media transport (UDP)
      - "127.0.0.1:9997:9997"   # MediaMTX REST API (internal only — P0-6)
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings
    environment:
      - MTX_API=yes
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # 2. Backend Server: Node.js API + SQLite DB + Cleanup Cron
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rtmp-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:5011:5011"   # API (internal only, access via Nginx — P0-6)
    volumes:
      - server-data:/app/data
      - ./recordings:/recordings
      - ./logs:/app/logs
    environment:
      - PORT=5011
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-live-stream-secret-key-change-in-production-random-64-char}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin@123}
      - RECORDING_RETENTION_DAYS=${RECORDING_RETENTION_DAYS:-7}
      - RECORDING_PATH=/recordings
      - LOGS_PATH=/app/logs
      - MEDIAMTX_API=http://mediamtx:9997
      - PUBLIC_HOST=${PUBLIC_HOST:-localhost}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-live.dhanushuav.in}
      - RTMP_HOST=${RTMP_HOST:-rtmp.dhanushuav.in}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      - mediamtx

  # 3. Frontend Web Dashboard: React 18 + Vite (Served via Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rtmp-client
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      - server

volumes:
  server-data:
